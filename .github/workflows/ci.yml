name: Broccoli Desktop CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synchronize Python dependencies
        run: uv sync --frozen
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Build CSS
        working-directory: ui
        run: npm run build
      - name: Check Python code
        run: .\scripts\check.ps1
      - name: Build onedir package
        run: .\scripts\package.ps1
      - name: Verify the packaged tree carries its data files
        shell: pwsh
        run: |
          $root = "dist/BroccoliDesktop/_internal/broccoli_desktop"
          foreach ($required in @(
            "static/app.js",
            "static/index.html",
            "static/output.css",
            "static/images/broccoli_icon.ico",
            "static/vendor/bootstrap-icons/bootstrap-icons.css"
          )) {
            if (-not (Test-Path (Join-Path $root $required))) {
              throw "Packaged build is missing $required"
            }
          }
      - name: Verify the packaged application starts
        shell: pwsh
        run: |
          # Two startup defects shipped unnoticed because every check stopped at
          # "the build succeeded": the archive was missing broccoli_desktop.runtime,
          # and uvicorn's logging setup called isatty() on the None stdout a
          # windowed build has. Both are invisible until the executable is run,
          # and running it from a shell hides the second one -- the process
          # inherits the shell's streams. Start-Process launches it the way a
          # shortcut does, with no console and no std handles.
          $process = Start-Process -FilePath "dist/BroccoliDesktop/BroccoliDesktop.exe" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $port = $null
            while ((Get-Date) -lt $deadline -and -not $port) {
              if ($process.HasExited) {
                throw "The packaged application exited with code $($process.ExitCode) instead of serving its local API."
              }
              $listening = Get-NetTCPConnection -OwningProcess $process.Id -State Listen -ErrorAction SilentlyContinue
              $port = ($listening | Where-Object { $_.LocalAddress -eq "127.0.0.1" } | Select-Object -First 1).LocalPort
              if (-not $port) { Start-Sleep -Milliseconds 500 }
            }
            if (-not $port) { throw "The packaged application never opened its loopback port." }
            # Reaching /health means the runtime imported, the logging setup
            # survived, and the local service is up. It says nothing about the
            # native window, which opens after this and needs a desktop session.
            $health = Invoke-RestMethod "http://127.0.0.1:$port/health" -TimeoutSec 10
            if ($health.status -ne "ok") { throw "The packaged application answered /health with $($health | ConvertTo-Json -Compress)." }
            Write-Host "The packaged application served /health on port $port."
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Build Windows installer
        run: .\scripts\installer.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BroccoliDesktop-installer
          path: dist/installer/BroccoliDesktop-0.1.0-setup.exe
          if-no-files-found: error

  visual:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synchronize Python dependencies
        run: uv sync --frozen
      - name: Build visual CSS
        working-directory: ui
        run: npm ci && npm run build
      - name: Install fixed browser tooling
        run: |
          npm install --global agent-browser@0.34.0
          agent-browser install
      - name: Run fake visual browser checks
        run: .\scripts\visual-check.ps1
      - name: Upload failed visual artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BroccoliDesktop-visual-failure
          path: artifacts/visual/
          if-no-files-found: ignore
